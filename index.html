<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Books</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fff;font-family:Inter,Arial,sans-serif}
body{overflow:hidden}
body.detail{overflow-y:auto}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;user-select:none;-webkit-user-drag:none}
#dim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .55s ease;z-index:2}
body.detail #dim{opacity:1}
#gl{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
#slot{position:absolute;z-index:2;background:rgba(0,0,0,.35);filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .18s ease;border-radius:3px}
#detail{position:relative;z-index:5;display:none;min-height:100vh;padding:0 0 12vh;pointer-events:none}
body.detail #detail{display:block;pointer-events:auto}
.section{min-height:100vh;display:grid;grid-template-columns:minmax(280px,42vw) minmax(320px,1fr);gap:7vw;align-items:center;padding:10vh 8vw}
.coverWrap{display:flex;justify-content:flex-end;align-items:center}
.cover{width:min(29vw,440px);aspect-ratio:.72;background:#d7c7a5;box-shadow:0 18px 70px rgba(0,0,0,.45);position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.coverInner{position:absolute;inset:0;padding:13% 12%;display:flex;flex-direction:column;justify-content:space-between;color:#111;background:linear-gradient(145deg,rgba(255,255,255,.16),transparent 40%),var(--cover,#c7b48d)}
.coverTitle{font:400 clamp(32px,4vw,58px)/.95 Georgia,serif;max-width:90%}
.coverAuthor{font:14px/1.3 Arial,sans-serif;letter-spacing:.02em;opacity:.72}
.copy{max-width:620px;text-shadow:0 1px 18px rgba(0,0,0,.4)}
.copy h1{font:400 clamp(40px,5vw,70px)/.94 Georgia,serif;margin:0 0 10px}
.copy .sub{font:italic 22px/1.3 Georgia,serif;margin:0 0 28px;color:#efebe5}
.copy .by{font-size:13px;color:#ccc;margin-bottom:34px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px;margin:0 0 28px;max-width:500px}
.meta div{font-size:13px;line-height:1.35;color:#ddd}
.meta span{display:block;font-size:11px;color:#9d9d9d;margin-bottom:5px}
.copy p{font:16px/1.6 Arial,sans-serif;color:#e6e2dc;margin:0;max-width:570px}
#close{position:fixed;top:22px;right:24px;z-index:20;width:40px;height:40px;border:0;background:transparent;color:#fff;font:32px/1 Arial;opacity:0;pointer-events:none;transition:opacity .25s}
body.detail #close{opacity:.82;pointer-events:auto}
#close:hover{opacity:1}
@media(max-width:800px){
 .section{grid-template-columns:1fr;gap:42px;align-content:center;padding:12vh 7vw}
 .coverWrap{justify-content:center}
 .cover{width:min(68vw,360px)}
 .copy{max-width:none}
 .copy h1{font-size:44px}
 .copy .sub{font-size:20px}
}
</style>
</head>
<body>
<div id="stage">
  <img id="photo" alt="Книги">
  <div id="slot"></div>
  <div id="dim"></div>
  <canvas id="gl"></canvas>
</div>
<button id="close" aria-label="Закрыть">×</button>
<main id="detail"></main>
<script type="module" src="./main.js"></script>
</body>
</html>
