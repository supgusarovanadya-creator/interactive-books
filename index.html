<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Books</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#090909;color:#f4f0e8;font-family:Arial,sans-serif}body{overflow:hidden}.scene{position:fixed;inset:0;background:#090909;overflow:hidden}.photo{position:absolute;inset:0;margin:auto;width:100%;height:100%;object-fit:contain;display:block}.hits{position:absolute;inset:0;z-index:2}.hit{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;touch-action:none}.float{position:fixed;z-index:4;pointer-events:none;background-repeat:no-repeat;transform-origin:center;filter:drop-shadow(0 14px 18px rgba(0,0,0,.42));transition:transform .42s cubic-bezier(.18,.82,.2,1),filter .42s,opacity .2s;will-change:transform}.float.peek{transform:translate3d(-8px,-10px,42px) scale(1.035) rotateY(-3deg);filter:drop-shadow(16px 18px 20px rgba(0,0,0,.48))}.detail{position:fixed;inset:0;z-index:5;background:rgba(8,8,8,.78);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .45s}.detail.on{opacity:1;pointer-events:auto;overflow-y:auto}.detail-inner{min-height:100vh;padding:9vh 8vw 12vh;display:grid;grid-template-columns:minmax(260px,36vw) minmax(280px,1fr);gap:8vw;align-items:center}.hero{position:relative;perspective:1400px;min-height:66vh;display:flex;align-items:center;justify-content:center}.book-card{width:min(31vw,390px);height:min(66vh,590px);position:relative;transform-style:preserve-3d;transform:rotateY(76deg) scale(.72);opacity:.2;transition:transform 1.05s cubic-bezier(.16,.84,.18,1),opacity .35s;filter:drop-shadow(0 28px 30px rgba(0,0,0,.5))}.detail.on .book-card{transform:rotateY(0deg) scale(1);opacity:1}.book-face{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:cover;border-radius:2px;backface-visibility:hidden}.book-edge{position:absolute;top:0;bottom:0;left:0;width:22px;transform-origin:left;transform:rotateY(90deg);background:linear-gradient(90deg,#d9d0bc,#8d826e);opacity:.9}.copy{max-width:620px;opacity:0;transform:translateY(22px);transition:opacity .55s .55s,transform .65s .55s}.detail.on .copy{opacity:1;transform:none}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:18px}.copy h1{font:400 clamp(42px,5vw,76px)/.95 Georgia,serif;margin:0 0 12px}.author{font:italic 20px/1.3 Georgia,serif;opacity:.82;margin-bottom:30px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px;font-size:13px;line-height:1.5;opacity:.68;margin-bottom:28px}.desc{font:17px/1.65 Arial,sans-serif;opacity:.82}.close{position:fixed;right:24px;top:24px;z-index:8;width:44px;height:44px;border:0;background:transparent;color:white;font-size:34px;cursor:pointer}.more{grid-column:1/-1;padding-top:8vh}.more h2{font:400 42px Georgia,serif;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.more-book{border:0;background:none;color:white;text-align:left;padding:0;cursor:pointer}.thumb{aspect-ratio:.68;background-repeat:no-repeat;background-size:cover;background-position:center;margin-bottom:12px;filter:brightness(.92);transition:transform .3s}.more-book:hover .thumb{transform:translateY(-5px)}.more-book span{font:22px Georgia,serif}.more-book small{display:block;opacity:.55;margin-top:5px}@media(max-width:760px){.detail-inner{display:block;padding:9vh 22px}.hero{min-height:54vh}.book-card{width:min(68vw,330px);height:50vh}.copy{padding:10px 4px 50px}.copy h1{font-size:42px}.grid{grid-template-columns:1fr 1fr;gap:16px}.more h2{font-size:32px}}</style></head><body><main class="scene"><img id="photo" class="photo" alt=""><div id="hits" class="hits"></div></main><section id="detail" class="detail"><button id="close" class="close" aria-label="Закрыть">×</button><div class="detail-inner"><div class="hero"><div id="card" class="book-card"><div id="face" class="book-face"></div><div class="book-edge"></div></div></div><div class="copy"><div class="eyebrow">Book archive</div><h1 id="title"></h1><div id="author" class="author"></div><div class="meta"><div><b>Edition</b><br>Personal collection</div><div><b>Language</b><br>Original edition</div></div><div class="desc">Здесь будет твой текст о книге. Блок сделан по референсу: обложка слева, информация справа, без лишнего интерфейса.</div></div><div class="more"><h2>Other books</h2><div id="grid" class="grid"></div></div></div></section><script type="module" src="./main.js"></script></body></html>
